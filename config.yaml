# ============================================================================
# Central configuration for all prediction pipelines.
# Edit thresholds here instead of scattered across individual scripts.
# ============================================================================

# --- Dixon-Coles model defaults ---
dixon_coles:
  default_home_advantage: 0.0
  default_rho: -0.05
  max_goals: 6              # score matrix dimension for daily DC
  max_goals_training: 10    # score matrix dimension for training / goals totals
  mc_iterations: 50000      # Monte Carlo simulation iterations
  fuzzy_match_threshold: 0.72

# --- Variance classification thresholds ---
variance:
  low: 0.145
  low_medium: 0.185
  medium: 0.22
  # anything above medium is HIGH

# --- Leagues that only allow LOW variance recommendations ---
strict_low_variance_leagues:
  - E1
  - RO1

# --- Double Chance (1X / X2) recommendation filters ---
dc:
  min_probability: 0.78
  min_odds: 1.25
  max_odds: 1.35

# --- First-Half Goal recommendation filters ---
fhg:
  min_probability: 0.78
  min_odds: 1.10
  max_odds: 1.25
  default_k: 1.2
  k_min: 0.6
  k_max: 2.0

# --- Goals Totals recommendation filters (per market) ---
goals:
  over_2_5:
    min_prob: 0.63
    max_prob: 1.00
    min_odds: 1.40
    max_odds: 1.95
    max_fair_odds: 1.59
  under_4_5:
    min_prob: 0.82
    max_prob: 0.93
    min_odds: 1.10
    max_odds: 1.35
    max_fair_odds: 1.22
  btts:
    min_prob: 0.60
    max_prob: 1.00
    min_odds: 1.50
    max_odds: 2.10
    max_fair_odds: 1.67

# --- Corners Under 12.5 recommendation filters ---
corners:
  min_probability: 0.78
  min_odds: 1.10
  max_odds: 1.35
  max_fair_odds: 1.30
  lambda_min: 2.5
  lambda_max: 18.0
  blend_empirical: 0.8     # weight for empirical lambda
  blend_league_mean: 0.2   # weight for league mean mu
  default_mu: 10.0
  default_k: 12.0
  k_min: 0.5
  k_max: 200.0
  tempo_min: 0.75
  tempo_max: 1.25

# --- Corners Under 7.5 First Half recommendation filters ---
# Audit 2026-05-21: Only TR2/D2/RS1/I1 are profitable at 1.10 (rate >90.9%).
# DK1/P1/E0/B1/SW1 are structurally negative — excluded via allowed_leagues.
corners_1h:
  min_probability: 0.91        # above break-even at 1.10 (90.9%)
  min_odds: 1.10
  max_odds: 1.35
  max_fair_odds: 1.10          # tight: only recommend when fair odds <= 1.10
  lambda_min: 1.0
  lambda_max: 9.0
  blend_empirical: 0.8
  blend_league_mean: 0.2
  default_mu: 4.3
  default_k: 12.0
  k_min: 0.5
  k_max: 200.0
  tempo_min: 0.75
  tempo_max: 1.25
  allowed_leagues: [TR2, D2, RS1, I1]   # only leagues with rate >90.9% empirical

# --- Shots on Target (per-team) recommendation filters ---
# Bookmaker SOT definition differs from Flashscore count (bookmaker ~1.9x higher globally).
# Scaling factor applies to our predicted lambdas before probability computation.
sot:
  scaling_factor: 1.90     # fallback global multiplier
  scaling_per_league:      # override per-league (calibrated from bookmaker odds April 2026)
    E0: 1.90   # Premier League — confirmed via Crystal Palace
    E1: 2.10   # Championship — confirmed via Coventry
    D1: 1.95   # Bundesliga — estimated, high volume league
    D2: 1.95
    SP1: 1.90  # La Liga — confirmed
    SP2: 1.90
    I1: 1.90   # Serie A — confirmed
    I2: 1.90
    F1: 1.90   # Ligue 1
    N1: 1.85   # Eredivisie
    P1: 2.00   # Liga Portugal — confirmed via Moreirense
    RO1: 1.80
    B1: 1.70   # Jupiler Pro — confirmed via Leuven + Genk
    B2: 1.70
    TR1: 1.85
    TR2: 1.85
    DK1: 1.80
    SW1: 1.85
    RS1: 1.80
    SA1: 1.90  # Saudi Pro League
  lines: [2.5, 3.5, 4.5, 5.5]
  min_probability: 0.60
  min_odds: 1.25
  max_odds: 2.50
  max_fair_odds: 1.85
  lambda_min: 0.5
  lambda_max: 8.0
  blend_empirical: 0.8
  blend_league_mean: 0.2
  default_mu_team: 2.4     # global fallback mean SOT per team (pre-scaling)
  default_k: 10.0
  k_min: 0.5
  k_max: 200.0
  tempo_min: 0.75
  tempo_max: 1.25
  # Fix #2: Recency decay weighting for team profiles.
  recency:
    enabled: true
    half_life_days: 140    # match weight = exp(-ln(2)/140 * days_ago), ~0.005 per day
  # Fix #3: Elo/class strength adjustment from team_ratings.pkl.
  elo:
    enabled: true
    sot_elasticity: 0.15   # lambda multiplier = 1 + elasticity * (attack_own - defence_opp)
    clip_min: 0.65         # never reduce lambda below 65% of baseline
    clip_max: 1.50         # never boost lambda above 150% of baseline
  # Fix #5: Squad depletion penalty (applied at daily prediction time).
  depletion:
    threshold: 3           # >= N key absences triggers penalty
    penalty_per_absence: 0.05  # lambda reduction per absent key player (capped)
    max_penalty: 0.25      # max 25% lambda reduction

# --- WTA Tennis prediction model ---
wta:
  rolling_window: 20           # last N matches on same surface for ratings
  surfaces: ["Hard", "Clay", "Grass"]
  mc_iterations: 10000
  min_matches_for_rating: 10   # minimum surface matches before player gets a rating
  surface_blend: 0.70          # weight for surface-specific stats (rest = overall)
  recency_decay: 0.05          # exponential decay per match for rolling stats
  markets:
    match_winner:
      min_prob: 0.62
      max_prob: 1.00
      min_odds: 1.20
      max_odds: 2.10
      min_edge: 0.03
    total_games_over:
      line: 19.5
      min_prob: 0.58
      max_prob: 1.00
      min_odds: 1.40
      max_odds: 2.00
      min_edge: 0.03
    total_games_under:
      line: 19.5
      min_prob: 0.58
      max_prob: 1.00
      min_odds: 1.40
      max_odds: 2.00
      min_edge: 0.03
    tiebreak:
      min_prob: 0.12
      max_prob: 0.35
      min_odds: 4.00
      max_odds: 12.00
      min_edge: 0.03
    set1_over_7_5:
      min_prob: 0.88
      max_prob: 1.00
      min_odds: 1.05
      max_odds: 1.30
      min_edge: 0.03
    set1_over_9_5:
      min_prob: 0.58
      max_prob: 1.00
      min_odds: 1.40
      max_odds: 2.20
      min_edge: 0.03
  elo:
    initial_rating: 1500
    k_initial: 40.0
    k_floor: 10.0
    k_decay_rate: 0.05
    blend_weight: 0.60          # p_final = w * p_markov + (1-w) * p_elo
  stability:
    max_matches_last_5d: 3        # reject if player played >N matches in last 5 days
    fatigue_window_days: 5
    min_hold_diff: 0.01           # reject if abs(p_hold_a - p_hold_b) < threshold
    max_match_prob: 0.97          # reject if p_match too extreme (one-sided)
    min_match_prob: 0.03          # reject if p_match too extreme (other side)
    variance_std_threshold: 6.5   # HIGH variance if MC std_total_games > threshold

  # Set 1 Over 7.5 — blowout / competitive filters (run_wta_daily). Tune via walk-forward ablation.
  set1_o75:
    elite_levels: ["WTA 1000", "Grand Slam", "WTA 500"]
    hold_floor: 0.62
    hold_strong_clay: 0.66
    hold_strong_default: 0.62
    blowout_hold_weak: 0.62
    blowout_hold_moderate: 0.65
    gap_large: 0.08
    asym_server_high: 0.68
    asym_server_low: 0.60
    clay_min_hold_blowout: 0.64
    lower_tier_min_hold: 0.64
    collapse_min_hold: 0.58
    comp_gap_tight: 0.07
    comp_gap_loose: 0.09
    comp_min_hold_loose_gap: 0.64
    clay_penalty_hold_lo: 0.64
    clay_penalty_hold_hi: 0.66
    clay_penalty_lo: 0.03
    clay_penalty_hi: 0.015
    hc_exp_games: 25.0
    hc_p_s1: 0.86
    hc_min_hold: 0.65
    hc_blowout_rescue_at: 4
    rec_min_exp_games: 23.0
    rec_min_p_s1: 0.81
    rec_max_blowout: 3
    elite_exp_games: 24.5
    elite_p_s1: 0.84
    elite_max_blowout: 2
    round_semifinal: 4
    round_final_plus: 5

  # HTTP for api.wtatennis.com (run_wta_daily). cache_ttl_seconds=0 disables cache.
  api:
    timeout_seconds: 20
    max_retries: 3
    backoff_factor: 0.5
    cache_dir: "simulations/WTA/cache/http"
    cache_ttl_seconds: 3600

  # Optional: down-weight ITF / challengers when rolling stats (Sackmann tourney_level codes).
  tier_weights:
    __default__: 1.0
    G: 1.0
    P: 1.0
    PM: 1.0
    I: 0.75
    F: 0.6
    D: 0.6
    W: 0.55
    O: 0.55

  # Grass: merge into set1_o75; optionally disable recommendation keys for this surface only.
  grass_policy:
    set1_o75:
      rec_max_blowout: 2
      rec_min_p_s1: 0.83
    disable_recommendations: []

  calibration:
    # Second stage after Platt on symmetric match-winner logits (reduces overconfidence).
    match_winner_temperature: true

  # Optional: slower walk-forward, enables analyze_wta_ablation.py filter vs baseline.
  backtest:
    store_expected_games: false
    expected_games_mc: 800

# --- Training defaults ---
training:
  team_ratings:
    lookback_days: 270
    decay_xi: 0.0025
    min_teams: 6
    min_matches: 35
  fhg:
    lookback_days: 365
    retrain_days: 30
    min_train_matches: 35
    min_train_teams: 6
    min_samples: 150
  goals:
    lookback_days: 365
    retrain_days: 30
    min_train_matches: 35
    min_train_teams: 6
    min_samples: 50
  corners:
    lookback_days: 365
    retrain_days: 30
    min_team_home: 5
    min_team_away: 5
  corners_1h:
    lookback_days: 365
    retrain_days: 30
    min_team_home: 5
    min_team_away: 5
  sot:
    lookback_days: 365
    retrain_days: 30
    min_team_home: 5
    min_team_away: 5
  wta:
    lookback_days: 730          # 2 years walk-forward window
    retrain_days: 30
    min_train_matches: 200
    min_players: 30
    min_samples: 100

# --- Notifications ---
# Daily pipeline writes a log to notifications.log_dir.
# Set notifications.email.enabled to true and fill in SMTP details to get
# email alerts on pipeline failures.
notifications:
  log_dir: "logs"                     # relative to project root
  email:
    enabled: false
    smtp_host: "smtp.example.com"
    smtp_port: 587
    use_tls: true
    username: ""                      # or use env var SMTP_USERNAME
    password: ""                      # or use env var SMTP_PASSWORD
    from_addr: "pred-pipeline@example.com"
    to_addrs:
      - "your-email@example.com"