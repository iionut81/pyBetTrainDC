# ============================================================================
# Central configuration for all prediction pipelines.
# Edit thresholds here instead of scattered across individual scripts.
# ============================================================================

# --- Dixon-Coles model defaults ---
dixon_coles:
  default_home_advantage: 0.0
  default_rho: -0.05
  max_goals: 6              # score matrix dimension for daily DC
  max_goals_training: 10    # score matrix dimension for training / goals totals
  mc_iterations: 50000      # Monte Carlo simulation iterations
  fuzzy_match_threshold: 0.72

# --- Variance classification thresholds ---
variance:
  low: 0.145
  low_medium: 0.185
  medium: 0.22
  # anything above medium is HIGH

# --- Leagues that only allow LOW variance recommendations ---
strict_low_variance_leagues:
  - E1
  - RO1

# --- Double Chance (1X / X2) recommendation filters ---
dc:
  min_probability: 0.78
  min_odds: 1.25
  max_odds: 1.35

# --- First-Half Goal recommendation filters ---
fhg:
  min_probability: 0.78
  min_odds: 1.10
  max_odds: 1.25
  default_k: 1.2
  k_min: 0.6
  k_max: 2.0

# --- Goals Totals recommendation filters (per market) ---
goals:
  over_2_5:
    min_prob: 0.63
    max_prob: 1.00
    min_odds: 1.40
    max_odds: 1.95
    max_fair_odds: 1.59
  under_3_5:
    min_prob: 0.65
    max_prob: 0.85
    min_odds: 1.25
    max_odds: 1.65
    max_fair_odds: 1.43
  under_4_5:
    min_prob: 0.82
    max_prob: 0.93
    min_odds: 1.10
    max_odds: 1.35
    max_fair_odds: 1.22
  btts:
    min_prob: 0.60
    max_prob: 1.00
    min_odds: 1.50
    max_odds: 2.10
    max_fair_odds: 1.67

# --- Corners Under 12.5 recommendation filters ---
corners:
  min_probability: 0.78
  min_odds: 1.10
  max_odds: 1.35
  max_fair_odds: 1.30
  lambda_min: 2.5
  lambda_max: 18.0
  blend_empirical: 0.8     # weight for empirical lambda
  blend_league_mean: 0.2   # weight for league mean mu
  default_mu: 10.0
  default_k: 12.0
  k_min: 0.5
  k_max: 200.0
  tempo_min: 0.75
  tempo_max: 1.25

# --- WTA Tennis prediction model ---
wta:
  rolling_window: 20           # last N matches on same surface for ratings
  surfaces: ["Hard", "Clay", "Grass"]
  mc_iterations: 10000
  min_matches_for_rating: 10   # minimum surface matches before player gets a rating
  surface_blend: 0.70          # weight for surface-specific stats (rest = overall)
  recency_decay: 0.05          # exponential decay per match for rolling stats
  markets:
    match_winner:
      min_prob: 0.62
      max_prob: 1.00
      min_odds: 1.20
      max_odds: 2.10
      min_edge: 0.03
    total_games_over:
      line: 19.5
      min_prob: 0.58
      max_prob: 1.00
      min_odds: 1.40
      max_odds: 2.00
      min_edge: 0.03
    total_games_under:
      line: 19.5
      min_prob: 0.58
      max_prob: 1.00
      min_odds: 1.40
      max_odds: 2.00
      min_edge: 0.03
    tiebreak:
      min_prob: 0.14
      max_prob: 0.35
      min_odds: 4.00
      max_odds: 12.00
      min_edge: 0.03
    set1_over_7_5:
      min_prob: 0.88
      max_prob: 1.00
      min_odds: 1.05
      max_odds: 1.30
      min_edge: 0.03
    set1_over_9_5:
      min_prob: 0.58
      max_prob: 1.00
      min_odds: 1.40
      max_odds: 2.20
      min_edge: 0.03
  elo:
    initial_rating: 1500
    k_initial: 40.0
    k_floor: 10.0
    k_decay_rate: 0.05
    blend_weight: 0.60          # p_final = w * p_markov + (1-w) * p_elo
  stability:
    max_matches_last_5d: 3        # reject if player played >N matches in last 5 days
    fatigue_window_days: 5
    min_hold_diff: 0.01           # reject if abs(p_hold_a - p_hold_b) < threshold
    max_match_prob: 0.97          # reject if p_match too extreme (one-sided)
    min_match_prob: 0.03          # reject if p_match too extreme (other side)
    variance_std_threshold: 6.5   # HIGH variance if MC std_total_games > threshold

# --- Training defaults ---
training:
  team_ratings:
    lookback_days: 270
    decay_xi: 0.0025
    min_teams: 6
    min_matches: 35
  fhg:
    lookback_days: 365
    retrain_days: 30
    min_train_matches: 35
    min_train_teams: 6
    min_samples: 150
  goals:
    lookback_days: 365
    retrain_days: 30
    min_train_matches: 35
    min_train_teams: 6
    min_samples: 100
  corners:
    lookback_days: 365
    retrain_days: 30
    min_team_home: 5
    min_team_away: 5
  wta:
    lookback_days: 730          # 2 years walk-forward window
    retrain_days: 30
    min_train_matches: 200
    min_players: 30
    min_samples: 100

# --- Notifications ---
# Daily pipeline writes a log to notifications.log_dir.
# Set notifications.email.enabled to true and fill in SMTP details to get
# email alerts on pipeline failures.
notifications:
  log_dir: "logs"                     # relative to project root
  email:
    enabled: false
    smtp_host: "smtp.example.com"
    smtp_port: 587
    use_tls: true
    username: ""                      # or use env var SMTP_USERNAME
    password: ""                      # or use env var SMTP_PASSWORD
    from_addr: "pred-pipeline@example.com"
    to_addrs:
      - "your-email@example.com"